version: "3.9"

services:
  app:
    build: .
    container_name: op-app-backend
    ports:
      - "8010:8010"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: op-app-db
    environment:
      POSTGRES_DB: op_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: